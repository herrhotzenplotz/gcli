image: debian/stable
packages:
  - build-essential
  - libssl-dev
  - libcurl4-openssl-dev
  - pkgconf
  - bison
  - flex
  - make
  - libtool
  - libbsd-dev
  - perl
sources:
  - https://git.sr.ht/~herrhotzenplotz/gcli
tasks:
  - build: |
      cd gcli
      ./configure --debug
      make -j 4 all
  - check: |
      cd gcli
      ./configure --debug
      make -j 4 check
  - copyright: |
      cd gcli
      tools/check-copyright
