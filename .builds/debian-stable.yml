image: debian/stable
packages:
  - build-essential
  - libssl-dev
  - libcurl4-openssl-dev
  - pkgconf
  - bison
  - flex
  - make
  - libtool
  - libbsd-dev
  - perl
  - valgrind
sources:
  - https://git.sr.ht/~herrhotzenplotz/gcli
tasks:
  - configure: |
      cd gcli
      ./configure --debug
  - build: |
      make -C gcli -j 4
  - check: |
      make -C gcli -j 4 check-valgrind
  - distcheck: |
      make -C gcli -j 4 distcheck
  - copyright: |
      cd gcli
      tools/check-copyright
