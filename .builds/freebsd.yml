image: freebsd/15.x
packages:
  - ca_root_nss
  - curl
  - libedit
  - libssh2
  - libtool
  - libunistring
  - pkg
  - pkgconf
  - readline
  - perl5
  - pdjson
  - valgrind
sources:
  - https://git.sr.ht/~herrhotzenplotz/gcli
tasks:
  - configure: |
      mkdir -p gcli/build
      cd gcli/build
      ../configure --debug
  - build: |
      make -C gcli/build -j 4
  - check: |
      make -C gcli/build -j 4 check-valgrind
  - distcheck: |
      make -C gcli/build -j 4 distcheck
