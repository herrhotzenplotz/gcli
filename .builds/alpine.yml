image: alpine/edge
packages:
  - libcurl
  - gcc
  - make
  - pkgconf
  - musl-dev
  - curl-dev
  - flex
  - bison
  - libbsd-dev
  - perl
  - libedit-dev
  - valgrind
sources:
  - https://git.sr.ht/~herrhotzenplotz/gcli
tasks:
  - configure: |
      mkdir -p gcli/build
      cd gcli/build
      ../configure --debug
  - build: |
      make -C gcli/build -j 4
  - check: |
      make -C gcli/build -j 4 check-valgrind
  - distcheck: |
      make -C gcli/build -j 4 distcheck
